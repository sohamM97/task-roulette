name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # web/sqflite_sw.js and web/sqlite3.wasm are built from one version of
      # sqflite_common_ffi_web, recorded in .github/sqflite_web_worker_version.
      # After a package upgrade the web app would talk to a worker built for
      # the old version, so fail until the files are rebuilt.
      - name: Check sqflite web worker version
        run: |
          LOCKED=$(awk '/^  sqflite_common_ffi_web:/{f=1} f && /^    version:/{gsub(/"/,"",$2); print $2; exit}' pubspec.lock)
          BUILT=$(cat .github/sqflite_web_worker_version)
          if [ "$LOCKED" != "$BUILT" ]; then
            echo "::error::pubspec.lock has sqflite_common_ffi_web $LOCKED, but web/sqflite_sw.js and web/sqlite3.wasm were built from $BUILT. Run 'dart run sqflite_common_ffi_web:setup --force', write $LOCKED to .github/sqflite_web_worker_version, and commit all three files."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Seven AuthService tests skip unless a Firebase API key is defined at
      # build time. Any value works: the HTTP calls go to a MockClient. The key
      # is set for this file only, because other tests expect sign-in to be
      # unconfigured.
      - name: Test AuthService with a Firebase key
        run: flutter test --dart-define=FIREBASE_API_KEY=test-key test/services/auth_service_test.dart
